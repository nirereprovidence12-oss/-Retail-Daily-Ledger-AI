<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Retail Daily Ledger AI - Lusaka</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#0f172a;color:white;font-family:sans-serif" class="p-6">
<div class="max-w-2xl mx-auto">
<div id="authBox" style="background:#1e293b;padding:24px;border-radius:16px">
<h2 class="text-xl font-bold text-center">Cloud Vendor Sign In - FIXED</h2>
<div class="flex gap-2 my-4"><button id="signInTab" class="bg-emerald-500 p-3 rounded flex-1">Sign In</button><button id="createTab" class="bg-slate-700 p-3 rounded flex-1">Create Account</button></div>
<input id="email" placeholder="Email" style="background:#0f172a;border:1px solid #334155;padding:10px;border-radius:8px;width:100%;color:white;margin:6px 0">
<input id="password" type="password" placeholder="Password" style="background:#0f172a;border:1px solid #334155;padding:10px;border-radius:8px;width:100%;color:white;margin:6px 0">
<input id="stallName" placeholder="Stall Name" style="background:#0f172a;border:1px solid #334155;padding:10px;border-radius:8px;width:100%;color:white;margin:6px 0">
<button id="authBtn" class="bg-emerald-500 p-3 rounded w-full font-bold mt-4">Sign In</button>
<p id="authMsg" class="mt-3 text-center" style="color:#f87171"></p>
</div>
<div id="dash" class="hidden" style="background:#1e293b;padding:24px;border-radius:16px"><h3>Welcome <span id="userEmail"></span></h3><p>Stall: <span id="stallDisplay"></span></p><button id="signOut" class="bg-red-500 p-3 rounded w-full mt-4">Sign Out</button></div>
</div>
<script>
let mode='signin';const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),stallEl=document.getElementById('stallName'),btn=document.getElementById('authBtn'),msg=document.getElementById('authMsg'),signInTab=document.getElementById('signInTab'),createTab=document.getElementById('createTab'),authBox=document.getElementById('authBox'),dash=document.getElementById('dash');
function setMode(m){mode=m;btn.textContent=m==='signin'?'Sign In':'Create Account';msg.textContent='';}
signInTab.onclick=()=>setMode('signin');createTab.onclick=()=>setMode('create');
function loadUsers(){try{return JSON.parse(localStorage.getItem('usersDB')||'{}')}catch{return{}}}
btn.onclick=()=>{const email=(emailEl.value||'').trim().toLowerCase(),password=(passEl.value||'').trim(),stall=(stallEl.value||'').trim();if(!email||!password){msg.textContent='Email and password required';return;}const users=loadUsers();if(mode==='create'){if(!stall){msg.textContent='Stall name required';return;}if(users[email]){msg.textContent='Account already exists. Sign In.';setMode('signin');return;}users[email]={password,stall,created:Date.now()};localStorage.setItem('usersDB',JSON.stringify(users));localStorage.setItem('vendorSession',JSON.stringify({email,stall}));showDash(email,stall);}else{if(!users[email]){msg.textContent='No account found. Please Create Account first.';return;}if(users[email].password!==password){msg.textContent='Wrong password!';return;}localStorage.setItem('vendorSession',JSON.stringify({email,stall:users[email].stall}));showDash(email,users[email].stall);}};
function showDash(e,s){authBox.classList.add('hidden');dash.classList.remove('hidden');document.getElementById('userEmail').textContent=e;document.getElementById('stallDisplay').textContent=s;}
function checkSession(){const sess=localStorage.getItem('vendorSession');if(sess){try{const s=JSON.parse(sess);showDash(s.email,s.stall);}catch{}}}
document.getElementById('signOut').onclick=()=>{localStorage.removeItem('vendorSession');dash.classList.add('hidden');authBox.classList.remove('hidden');setMode('signin');};checkSession();setMode('signin');
</script>
</body>
</html>
