<script>
    let inventoryQueue = [];
    let expensesList = [];
    let dailyVault = [];

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadSavedData();
      
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('gemini-api-key').value = savedKey;
      }
    });

    function saveAPIKey(key) {
      localStorage.setItem('gemini_api_key', key.trim());
      alert("Gemini API Key saved securely in browser storage!");
    }

    function loadSavedData() {
      const savedInv = localStorage.getItem('retail_inventory');
      if (savedInv) inventoryQueue = JSON.parse(savedInv);

      const savedExp = localStorage.getItem('retail_expenses');
      if (savedExp) expensesList = JSON.parse(savedExp);

      const savedVault = localStorage.getItem('retail_vault');
      if (savedVault) dailyVault = JSON.parse(savedVault);

      renderInventoryStock();
      renderExpenses();
      renderVault();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      loginSuccess(email.split('@')[0] || email);
    }

    function startGuestDemo() {
      loginSuccess("Guest Vendor");
    }

    function loginSuccess(userName) {
      document.getElementById('user-display').innerText = userName;
      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
      lucide.createIcons();
    }

    function logout() {
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('landing-screen').style.display = 'flex';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    function dismissWarning() {
      document.getElementById('expiry-banner').style.display = 'none';
    }

    function clearAllData() {
      if (confirm("Are you sure you want to clear all inventory, expenses, and vault records?")) {
        localStorage.clear();
        inventoryQueue = [];
        expensesList = [];
        dailyVault = [];
        document.getElementById('daily-revenue-input').value = "0.00";
        renderInventoryStock();
        renderExpenses();
        renderVault();
        alert("System data successfully cleared!");
      }
    }

    function addNewStockBatch() {
      const itemName = document.getElementById('add-item').value.trim();
      const vendor = document.getElementById('add-vendor').value.trim() || "Local Supplier";
      const qty = parseInt(document.getElementById('add-qty').value);
      const expiryDate = document.getElementById('add-expiry').value;
      const demand = document.getElementById('add-demand').value;

      if (!itemName || isNaN(qty) || !expiryDate) {
        alert("Please enter an item name, quantity, and valid expiration date!");
        return;
      }

      const today = new Date();
      const diffTime = new Date(expiryDate) - today;
      const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      inventoryQueue.push({
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        item: itemName,
        vendor: vendor,
        qty_supplied: qty,
        qty_remaining: qty,
        expiry: expiryDate,
        daysLeft: daysLeft > 0 ? daysLeft : 0,
        demand: demand
      });

      localStorage.setItem('retail_inventory', JSON.stringify(inventoryQueue));
      document.getElementById('add-item').value = '';
      document.getElementById('add-vendor').value = '';
      document.getElementById('add-qty').value = '';
      document.getElementById('add-expiry').value = '';

      renderInventoryStock();
    }

    function renderInventoryStock() {
      const tbody = document.getElementById('inventory-table-body');
      const select = document.getElementById('pos-item-select');
      const banner = document.getElementById('expiry-banner');
      const bannerText = document.getElementById('expiry-banner-text');

      tbody.innerHTML = '';
      select.innerHTML = '<option value="">Select item to sell...</option>';

      if (inventoryQueue.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 2rem;">No active stock batches.</td></tr>';
        document.getElementById('metric-fast').innerText = '0';
        document.getElementById('metric-near').innerText = '0';
        document.getElementById('metric-slow').innerText = '0';
        banner.style.display = 'none';
        return;
      }

      let fastCount = 0, nearCount = 0, slowCount = 0;
      let nearExpiryNames = [];

      inventoryQueue.forEach((batch, index) => {
        if (batch.demand === 'high') fastCount++;
        if (batch.demand === 'low') slowCount++;

        const daysLeft = Math.ceil((new Date(batch.expiry) - new Date()) / (1000 * 60 * 60 * 24));
        if (daysLeft <= 3 && batch.qty_remaining > 0) {
          nearCount++;
          nearExpiryNames.push(`${batch.item} (${daysLeft}d left)`);
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${batch.date}</td>
          <td><strong>${batch.item}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${batch.vendor}</span></td>
          <td>${batch.qty_supplied}</td>
          <td><strong style="color:var(--primary-green);">${batch.qty_remaining}</strong></td>
          <td><span style="padding:0.2rem 0.5rem; border-radius:4px; font-size:0.75rem; font-weight:700; background:${daysLeft <= 3 ? '#ffebe6; color:#de350b' : '#e6f4ea; color:#00875a'}">${daysLeft <= 0 ? 'Expired' : daysLeft + ' days left'}</span></td>
          <td>
            <button class="kwacha-btn" onclick="adjustStock(${index}, -1)">-1</button>
            <button class="kwacha-btn" onclick="adjustStock(${index}, 1)">+1</button>
          </td>
        `;
        tbody.appendChild(tr);

        if (batch.qty_remaining > 0) {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = `${batch.item} (Avail: ${batch.qty_remaining})`;
          select.appendChild(opt);
        }
      });

      document.getElementById('metric-fast').innerText = fastCount;
      document.getElementById('metric-near').innerText = nearCount;
      document.getElementById('metric-slow').innerText = slowCount;

      if (nearCount > 0) {
        banner.style.display = 'flex';
        bannerText.innerText = `ACTIVE STOCK EXPIRY WARNING: ${nearExpiryNames.join(', ')}`;
      } else {
        banner.style.display = 'none';
      }

      localStorage.setItem('retail_inventory', JSON.stringify(inventoryQueue));
    }

    function adjustStock(index, delta) {
      inventoryQueue[index].qty_remaining += delta;
      if (inventoryQueue[index].qty_remaining < 0) inventoryQueue[index].qty_remaining = 0;
      renderInventoryStock();
    }

    function deductPOSSale() {
      const select = document.getElementById('pos-item-select');
      const qtyInput = parseInt(document.getElementById('pos-qty').value) || 1;
      const idx = select.value;

      if (idx === "") { alert("Please select an item to sell!"); return; }

      const batch = inventoryQueue[idx];
      if (qtyInput > batch.qty_remaining) {
        alert(`Only ${batch.qty_remaining} units remaining in this batch!`);
        return;
      }

      batch.qty_remaining -= qtyInput;
      renderInventoryStock();
      alert(`Deducted ${qtyInput} unit(s) of ${batch.item}!`);
    }

    function addManualExpenseRow() {
      expensesList.push({ item: "Supplier Restock", amount: 150.00 });
      renderExpenses();
    }

    function renderExpenses() {
      const container = document.getElementById('expenses-container');
      container.innerHTML = '';
      let total = 0;
      let highestExpense = null;

      expensesList.forEach((exp, idx) => {
        const amt = parseFloat(exp.amount || 0);
        total += amt;
        if (!highestExpense || amt > highestExpense.amount) highestExpense = { item: exp.item, amount: amt };

        const div = document.createElement('div');
        div.style.cssText = "display: flex; gap: 0.5rem; align-items: center;";
        div.innerHTML = `
          <input type="text" class="input-field" style="flex: 2;" value="${exp.item}" onchange="updateExpense(${idx}, 'item', this.value)">
          <input type="number" class="input-field" style="flex: 1;" value="${exp.amount}" onchange="updateExpense(${idx}, 'amount', this.value)">
          <button class="btn btn-danger" style="width: auto; padding: 0.5rem;" onclick="removeExpense(${idx})"><i data-lucide="trash-2" style="width:14px;"></i></button>
        `;
        container.appendChild(div);
      });

      document.getElementById('expense-count-label').innerText = `SCANNED SUPPLIER EXPENSES (${expensesList.length})`;
      document.getElementById('total-expenses-display').innerText = `ZMW ${total.toFixed(2)}`;

      const diagnosticBox = document.getElementById('ai-diagnostic-text');
      if (highestExpense) {
        const pct = total > 0 ? ((highestExpense.amount / total) * 100).toFixed(0) : 0;
        diagnosticBox.innerHTML = `<strong>💡 AI Co-Pilot Cost Insights</strong><br>🔥 <strong>Top Cost Driver:</strong> "${highestExpense.item}" is your biggest expense at <strong>ZMW ${highestExpense.amount.toFixed(2)}</strong> (${pct}% of outflows).`;
      } else {
        diagnosticBox.innerHTML = `<strong>💡 AI Inventory Co-Pilot Diagnostics</strong><br>✨ System initialized. Add stock batches or scan receipts to generate dynamic AI insights.`;
      }

      lucide.createIcons();
      localStorage.setItem('retail_expenses', JSON.stringify(expensesList));
    }

    function updateExpense(idx, field, val) {
      expensesList[idx][field] = val;
      renderExpenses();
    }

    function removeExpense(idx) {
      expensesList.splice(idx, 1);
      renderExpenses();
    }

    function addKwacha(amount) {
      const input = document.getElementById('daily-revenue-input');
      input.value = ((parseFloat(input.value) || 0) + amount).toFixed(2);
    }

    function resetRevenue() {
      document.getElementById('daily-revenue-input').value = "0.00";
    }

    // Z-REPORT SCANNING (Gemini 3.8 Flash)
    async function handleZReportUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('scan-status');
      statusEl.innerText = "⏳ Parsing Z-Report with Gemini Vision API...";

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        statusEl.innerText = "⚠️ Please enter your Gemini API Key first!";
        alert("Please paste your Gemini API Key in the settings field above.");
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: file.type, data: base64Data } },
                  { text: "Extract total net sales amount and items sold with quantities from this Z-report slip. Return ONLY valid JSON format: {\"net_sales\": number, \"items_sold\": [{\"name\": string, \"qty\": number}]}." }
                ]
              }]
            })
          });

          const result = await response.json();
          if (result.error) throw new Error(result.error.message);

          const rawText = result.candidates[0].content.parts[0].text;
          const cleanJson = JSON.parse(rawText.replace(/```json|```/g, '').trim());

          const revenue = cleanJson.net_sales || 3500.00;
          document.getElementById('daily-revenue-input').value = revenue.toFixed(2);

          if (cleanJson.items_sold && Array.isArray(cleanJson.items_sold)) {
            cleanJson.items_sold.forEach(sold => {
              const batch = inventoryQueue.find(b => b.item.toLowerCase().includes(sold.name.toLowerCase()) && b.qty_remaining > 0);
              if (batch) {
                batch.qty_remaining = Math.max(0, batch.qty_remaining - (sold.qty || 1));
              }
            });
            renderInventoryStock();
          }

          dailyVault.unshift({
            date: new Date().toLocaleString(),
            type: "Z-Report Scan",
            details: "Terminal Sales Slip",
            amount: `+ZMW ${revenue.toFixed(2)}`,
            status: "Recorded"
          });
          localStorage.setItem('retail_vault', JSON.stringify(dailyVault));
          renderVault();

          statusEl.innerText = `✅ Z-Report Scanned! Revenue Updated: ZMW ${revenue.toFixed(2)}`;
        } catch (err) {
          console.error(err);
          alert("Gemini API Error during Z-Report scan: " + err.message);
          statusEl.innerText = "❌ Scan Failed. Check API Key or image clarity.";
        }
      };
      reader.readAsDataURL(file);
    }

    // SUPPLIER RECEIPT SCANNING (Gemini 3.8 Flash)
    async function handleSupplierReceiptUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('scan-status');
      statusEl.innerText = "⏳ Parsing Supplier Receipt with Gemini Vision API...";

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        statusEl.innerText = "⚠️ Please enter your Gemini API Key first!";
        alert("Please paste your Gemini API Key in the settings field above.");
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: file.type, data: base64Data } },
                  { text: "Extract vendor name, total amount, and purchased items with name, qty, price, and days_to_expiry from this supplier receipt. Return ONLY valid JSON format: {\"vendor\": string, \"total\": number, \"items\": [{\"name\": string, \"qty\": number, \"price\": number, \"days_to_expiry\": number}]}." }
                ]
              }]
            })
          });

          const result = await response.json();
          if (result.error) throw new Error(result.error.message);

          const rawText = result.candidates[0].content.parts[0].text;
          const cleanJson = JSON.parse(rawText.replace(/```json|```/g, '').trim());

          const vendor = cleanJson.vendor || "Supplier Vendor";
          const total = cleanJson.total || 500.00;

          expensesList.push({ item: vendor, amount: total });
          renderExpenses();

          if (cleanJson.items && Array.isArray(cleanJson.items)) {
            cleanJson.items.forEach(prod => {
              const expDate = new Date();
              expDate.setDate(expDate.getDate() + (prod.days_to_expiry || 14));

              inventoryQueue.push({
                id: Date.now() + Math.random(),
                date: new Date().toLocaleDateString(),
                item: prod.name || "Stock Item",
                vendor: vendor,
                qty_supplied: prod.qty || 10,
                qty_remaining: prod.qty || 10,
                expiry: expDate.toISOString().slice(0,10),
                demand: "normal"
              });
            });
            localStorage.setItem('retail_inventory', JSON.stringify(inventoryQueue));
            renderInventoryStock();
          }

          dailyVault.unshift({
            date: new Date().toLocaleString(),
            type: "Supplier Receipt",
            details: vendor,
            amount: `-ZMW ${total.toFixed(2)}`,
            status: "Expense & Stock"
          });
          localStorage.setItem('retail_vault', JSON.stringify(dailyVault));
          renderVault();

          statusEl.innerText = `✅ Receipt Scanned! Added Expense (ZMW ${total.toFixed(2)}) & Synced FIFO Stock.`;
        } catch (err) {
          console.error(err);
          alert("Gemini API Error during Receipt scan: " + err.message);
          statusEl.innerText = "❌ Scan Failed. Check API Key or image clarity.";
        }
      };
      reader.readAsDataURL(file);
    }

    function calculateAndSaveLedger() {
      const rev = parseFloat(document.getElementById('daily-revenue-input').value) || 0;
      let expTotal = 0;
      expensesList.forEach(e => expTotal += parseFloat(e.amount || 0));

      const netProfit = rev - expTotal;

      dailyVault.unshift({
        date: new Date().toLocaleDateString(),
        type: "Daily Closeout",
        details: `Rev: ZMW ${rev.toFixed(2)} | Exp: ZMW ${expTotal.toFixed(2)}`,
        amount: `Net: ZMW ${netProfit.toFixed(2)}`,
        status: netProfit >= 0 ? 'Balanced' : 'Deficit'
      });

      localStorage.setItem('retail_vault', JSON.stringify(dailyVault));
      renderVault();

      alert(`Ledger Logged Successfully!\nNet Profit: ZMW ${netProfit.toFixed(2)}`);
      switchTab('tab-vault', document.querySelectorAll('.tab-btn')[2]);
    }

    function renderVault() {
      const tbody = document.getElementById('vault-table-body');
      tbody.innerHTML = '';

      if (dailyVault.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No saved records yet.</td></tr>';
        return;
      }

      dailyVault.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.date}</td>
          <td><strong style="color:var(--primary-green);">${row.type}</strong></td>
          <td>${row.details}</td>
          <td>${row.amount}</td>
          <td><span style="padding:0.2rem 0.5rem; border-radius:4px; font-size:0.75rem; font-weight:700; background:#e6f4ea; color:#00875a">${row.status}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportCSV() {
      if (dailyVault.length === 0) { alert("No vault records to export!"); return; }
      let csv = "Date,Type,Details,Amount,Status\n";
      dailyVault.forEach(r => { csv += `"${r.date}","${r.type}","${r.details}","${r.amount}","${r.status}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `Ledger_Archive_${new Date().toISOString().slice(0,10)}.csv`);
      a.click();
    }

    function shareWhatsApp() {
      if (dailyVault.length === 0) { alert("No records to share!"); return; }
      let latest = dailyVault[0];
      const text = `📊 *Retail Daily Ledger AI* %0ADate: ${latest.date}%0AType: ${latest.type}%0ADetails: ${latest.details}%0AAmount: ${latest.amount}`;
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }
  </script>
